<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      background: #000;
      color: #fafafa;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mono { font-family: "Inconsolata", ui-monospace, monospace; }
    .wordmark { font-size: 76px; font-weight: 700; letter-spacing: 0.01em; }
    .wordmark .dot { color: #34d399; }
    .wordmark .sub { color: #a3a3a3; }
    .tagline { color: #a3a3a3; font-size: 30px; margin-top: 14px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .card {
      background: #121212;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 22px 24px;
    }
    .card .term { font-size: 40px; font-weight: 700; }
    .card .full { color: #cfcfcf; font-size: 22px; margin-top: 6px; }
    .foot { display: flex; align-items: center; justify-content: space-between; }
    .url { color: #fafafa; font-size: 26px; }
    .url .accent { color: #34d399; }
    .pill {
      color: #34d399;
      border: 1px solid #34d399;
      background: rgba(52,211,153,0.16);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 22px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div>
    <div class="wordmark mono">minecraft<span class="dot">.</span><span class="sub">abbreviations</span></div>
    <div class="tagline">the OG account trading dictionary</div>
  </div>

  <div class="cards">
    <div class="card"><div class="term mono">OG</div><div class="full">Original</div></div>
    <div class="card"><div class="term mono">NFA</div><div class="full">No Full Access</div></div>
    <div class="card"><div class="term mono">FA</div><div class="full">Full Access</div></div>
    <div class="card"><div class="term mono">MM</div><div class="full">Middleman</div></div>
  </div>

  <div class="foot">
    <div class="url mono">iraqies.github.io/dictionary<span class="accent">.</span></div>
    <div class="pill mono">plain-English definitions</div>
  </div>
</body>
</html>
